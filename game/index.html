<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b38">
<meta name="description" content="A storm rescue flight across a volcanic archipelago.">
<title>STORMPOST — Islewatch Flight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c2230'/%3E%3Cpath d='M4 17h9l3-7 3 12 3-5h6' stroke='%236fe3d2' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; background: #102632; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: #102632; font-family: Georgia, 'Times New Roman', serif; }
  #flight-view { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; outline: none; }
  #flight-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

</style>
</head>
<body>
<canvas id="flight-view" role="img" aria-label="STORMPOST rescue flight over volcanic islands. Use keyboard or hold and drag to fly."></canvas>
<p id="flight-status" role="status" aria-live="polite">STORMPOST. Press Enter to launch the rescue flight.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
